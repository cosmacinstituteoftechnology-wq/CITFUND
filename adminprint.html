<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details - CIT FUND</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #0b1f4a;
            --primary-dark: #06183d;
            --accent: #ff5a00;
            --accent-light: #ff8c42;
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #1a2b4c;
            --muted: #6b7a8f;
            --border: #e8edf5;
            --success: #00c853;
            --danger: #e74c3c;
            --warning: #ff9800;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }

        /* Header */
        .print-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 15px;
            margin-bottom: 20px;
            background: var(--card);
            padding: 20px;
            border-radius: 15px;
        }
        .print-header h1 { font-size: 24px; color: var(--primary); }
        .print-header .logo { font-size: 30px; color: var(--accent); }

        /* Action Buttons */
        .actions { margin: 20px 0; display: flex; gap: 10px; flex-wrap: wrap; }
        .actions button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .actions button.secondary { background: var(--primary); }
        .actions button.warning { background: var(--warning); }
        .actions button.success { background: var(--success); }
        .actions button:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Cards */
        .card { background: var(--card); border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); border: 1px solid var(--border); }

        /* User Profile Section */
        .profile-section { display: flex; gap: 20px; align-items: center; }
        .profile-section img { width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--accent); object-fit: cover; }
        .profile-section .info h2 { margin: 0; }
        .profile-section .info p { color: var(--muted); }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        td { border: 1px solid var(--border); padding: 10px; }
        td.label { font-weight: 700; background: #f8f9fc; width: 30%; }
        td.value { font-weight: 600; }

        h2 { color: var(--primary); margin-top: 20px; border-bottom: 2px solid var(--border); padding-bottom: 8px; }

        /* Transactions */
        .tx-item { border: 1px solid var(--border); padding: 10px; margin-bottom: 8px; border-radius: 6px; background: #f8f9fc; }
        .tx-item .date { font-size: 12px; color: var(--muted); }

        /* KYC Status */
        .badge { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .badge.approved { background: #e6fff0; color: var(--success); }
        .badge.pending { background: #fff8e1; color: var(--warning); }
        .badge.none { background: #f0f0f0; color: var(--muted); }
        .badge.denied { background: #ffe6e6; color: var(--danger); }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
        .modal-close { float: right; cursor: pointer; font-size: 24px; }

        /* Print-specific */
        @media print {
            .actions { display: none; }
            body { padding: 0; }
            .print-header { border-bottom: 2px solid #000; box-shadow: none; }
            .card { box-shadow: none; border: 1px solid #ddd; }
        }
    </style>
</head>
<body>

    <div id="loadingOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:99999;display:flex;justify-content:center;align-items:center;color:white;font-size:24px;display:none;">
        <i class="fa-solid fa-spinner fa-spin"></i> Loading...
    </div>

    <!-- Header -->
    <div class="print-header">
        <div>
            <h1><i class="fa-solid fa-building-columns"></i> CIT FUND BANK</h1>
            <p style="font-size:12px; color:var(--muted);">YOUR TRUST, OUR COMMITMENT</p>
        </div>
        <span class="logo"><i class="fa-solid fa-user"></i></span>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
        <button onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
        <button class="secondary" onclick="window.location.href='admin.html'"><i class="fa-solid fa-arrow-left"></i> Back to Admin</button>
        <button class="success" onclick="downloadAsPDF()"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>
        <button class="warning" onclick="sendEmail()"><i class="fa-solid fa-envelope"></i> Email Report</button>
        <button class="secondary" onclick="viewFullProfile()"><i class="fa-solid fa-id-card"></i> Full Profile</button>
    </div>

    <!-- User Profile Card -->
    <div class="card">
        <div class="profile-section">
            <img id="userPhoto" src="https://via.placeholder.com/100" alt="User Photo">
            <div class="info">
                <h2 id="userName">—</h2>
                <p id="userAccount">Account: —</p>
                <p id="userKYC">KYC: <span class="badge none">None</span></p>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div id="content"></div>

    <!-- Modal for Full Profile -->
    <div id="fullProfileModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h2>Full User Profile</h2>
            <div id="fullProfileContent"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const uid = params.get('uid');
        const type = params.get('type') || 'print';

        if (!uid) {
            document.body.innerHTML = '<p>No user selected. <a href="admin.html">Go back</a></p>';
        } else {
            showLoading();
            fetchUserDetails();
        }

        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        async function fetchUserDetails() {
            try {
                const res = await fetch('/api/admin/user-details', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid: uid })
                });
                const data = await res.json();
                if (data.success) {
                    renderUser(data.user);
                } else {
                    document.body.innerHTML = '<p>Error: ' + data.error + '</p>';
                }
            } catch (e) {
                document.body.innerHTML = '<p>Server error: ' + e.message + '</p>';
            } finally {
                hideLoading();
            }
        }

        function renderUser(u) {
            // Photo
            if (u.photo) {
                document.getElementById('userPhoto').src = u.photo;
            }
            document.getElementById('userName').textContent = u.fullName || 'N/A';
            document.getElementById('userAccount').textContent = 'Account: ' + (u.accountNumber || 'N/A');

            // KYC badge
            const kycStatus = u.kyc ? u.kyc.status : 'none';
            const kycBadge = document.getElementById('userKYC');
            kycBadge.innerHTML = 'KYC: <span class="badge ' + kycStatus + '">' + kycStatus.toUpperCase() + '</span>';

            // Generate content
            let html = '';

            // Personal Information
            html += '<div class="card">';
            html += '<h2>Personal Information</h2>';
            html += '<table>';
            html += '<tr><td class="label">Full Name</td><td class="value">' + (u.fullName || 'N/A') + '</td></tr>';
            html += '<tr><td class="label">Date of Birth</td><td class="value">' + (u.dob || 'N/A') + '</td></tr>';
            html += '<tr><td class="label">Gender</td><td class="value">' + (u.gender || 'N/A') + '</td></tr>';
            html += '<tr><td class="label">Nationality</td><td class="value">' + (u.nationality || 'N/A') + '</td></tr>';
            html += '<tr><td class="label">Marital Status</td><td class="value">' + (u.marital || 'N/A') + '</td></tr>';
            html += '<tr><td class="label">Place of Birth</td><td class="value">' + (u.placeOfBirth || 'N/A') + '</td></tr>';
            html += '</table>';
            html += '</div>';

            // Account Information
            html += '<div class="card">';
            html += '<h2>Account Information</h2>';
            html += '<table>';
            html += '<tr><td class="label">Account Number</td><td class="value">' + (u.accountNumber || 'N/A') + '</td></tr>';
            html += '<tr><td class="label">Member ID</td><td class="value">' + (u.memberID || 'N/A') + '</td></tr>';
            html += '<tr><td class="label">Account Type</td><td class="value">' + (u.accType || 'Savings') + '</td></tr>';
            html += '<tr><td class="label">Branch</td><td class="value">' + (u.branch || 'N/A') + '</td></tr>';
            html += '<tr><td class="label">Currency</td><td class="value">' + (u.currency || 'GHS') + '</td></tr>';
            html += '<tr><td class="label">Balance</td><td class="value">GHS ' + (u.balance || 0).toFixed(2) + '</td></tr>';
            html += '</table>';
            html += '</div>';

            // Contact Information
            html += '<div class="card">';
            html += '<h2>Contact Information</h2>';
            html += '<table>';
            html += '<tr><td class="label">Email</td><td class="value">' + (u.email || 'N/A') + '</td></tr>';
            html += '<tr><td class="label">Phone</td><td class="value">' + (u.phone || 'N/A') + '</td></tr>';
            html += '<tr><td class="label">Address</td><td class="value">' + (u.address || 'N/A') + '</td></tr>';
            html += '<tr><td class="label">City</td><td class="value">' + (u.city || 'N/A') + '</td></tr>';
            html += '<tr><td class="label">Region</td><td class="value">' + (u.region || 'N/A') + '</td></tr>';
            html += '<tr><td class="label">Postal Code</td><td class="value">' + (u.postal || 'N/A') + '</td></tr>';
            html += '</table>';
            html += '</div>';

            // Next of Kin
            if (u.nokName) {
                html += '<div class="card">';
                html += '<h2>Next of Kin</h2>';
                html += '<table>';
                html += '<tr><td class="label">Full Name</td><td class="value">' + (u.nokName || 'N/A') + '</td></tr>';
                html += '<tr><td class="label">Relationship</td><td class="value">' + (u.nokRel || 'N/A') + '</td></tr>';
                html += '<tr><td class="label">Phone</td><td class="value">' + (u.nokPhone || 'N/A') + '</td></tr>';
                html += '<tr><td class="label">Email</td><td class="value">' + (u.nokEmail || 'N/A') + '</td></tr>';
                html += '<tr><td class="label">Address</td><td class="value">' + (u.nokAddress || 'N/A') + '</td></tr>';
                html += '</table>';
                html += '</div>';
            }

            // Employment Info
            html += '<div class="card">';
            html += '<h2>Employment Information</h2>';
            html += '<table>';
            html += '<tr><td class="label">Occupation</td><td class="value">' + (u.occupation || 'N/A') + '</td></tr>';
            html += '<tr><td class="label">Employer</td><td class="value">' + (u.employer || 'N/A') + '</td></tr>';
            html += '<tr><td class="label">Income Range</td><td class="value">' + (u.income || 'N/A') + '</td></tr>';
            html += '<tr><td class="label">Source of Funds</td><td class="value">' + (u.sourceFunds || 'N/A') + '</td></tr>';
            html += '</table>';
            html += '</div>';

            // KYC Status
            html += '<div class="card">';
            html += '<h2>KYC Status</h2>';
            html += '<table>';
            html += '<tr><td class="label">Status</td><td class="value">' + kycStatus.toUpperCase() + '</td></tr>';
            if (u.kyc && u.kyc.submittedAt) {
                html += '<tr><td class="label">Submitted</td><td class="value">' + new Date(u.kyc.submittedAt).toLocaleString() + '</td></tr>';
            }
            html += '</table>';
            html += '</div>';

            // Transactions
            html += '<div class="card">';
            html += '<h2>Transactions</h2>';
            if (u.transactions && Object.keys(u.transactions).length > 0) {
                Object.values(u.transactions).reverse().slice(0, 20).forEach(tx => {
                    html += '<div class="tx-item">';
                    html += '<strong>' + tx.type.charAt(0).toUpperCase() + tx.type.slice(1) + '</strong> - GHS ' + Number(tx.amount).toFixed(2);
                    html += '<div class="date">' + (tx.date || '') + '</div>';
                    html += '</div>';
                });
            } else {
                html += '<p>No transactions found.</p>';
            }
            html += '</div>';

            document.getElementById('content').innerHTML = html;

            // Set modal content for full profile
            document.getElementById('fullProfileContent').innerHTML = html;
        }

        function downloadAsPDF() {
            window.print();
        }

        function sendEmail() {
            const email = document.getElementById('userEmail').textContent || 'customer@citfund.com';
            const subject = 'CIT FUND Bank - Account Statement';
            const body = 'Please find attached the statement for user.';
            window.location.href = 'mailto:' + email + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
        }

        function viewFullProfile() {
            document.getElementById('fullProfileModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('fullProfileModal').classList.remove('show');
        }
    </script>
</body>
</html>
